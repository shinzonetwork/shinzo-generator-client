# Default configuration - environment variables will override these

# Chain configuration - identifies which EVM chain to index
# Supported chains: Ethereum, Arbitrum, Optimism, Avalanche (or any EVM chain)
# Collection names are derived as: {name}__{network}__Block, etc.
chain:
  name: "BSC"        # Chain name (env: CHAIN_NAME)
  network: "Mainnet"     # Network name (env: CHAIN_NETWORK)
  adapter: "evm"         # Chain adapter: "evm" (default). Future: "cosmos", etc. (env: CHAIN_ADAPTER)
  hub: "testnet.shinzo.network"
defradb:
  url: "http://localhost:9181"  # Empty = embedded DefraDB
  keyring_secret: "" # over written by env var
  embedded: true
  p2p:
    enabled: true
    accept_incoming: false          # Accept incoming P2P documents. false = reject all (generator is source of truth).
    bootstrap_peers: []
    listen_addr: "/ip4/0.0.0.0/tcp/9171"
    max_retries: 5                  # Number of connection attempts before marking peer as failed
    retry_base_delay_ms: 1000       # Base delay for exponential backoff (1s, 2s, 4s, 8s, 16s)
    reconnect_interval_ms: 60000    # Check for disconnected peers every 60 seconds
    enable_auto_reconnect: true     # Automatically reconnect to failed/disconnected peers
    # libp2p resource-manager limits. Left at 0, libp2p autoscales them from the memory the
    # process can see - the host machine's, not the container's mem_limit - so a node is granted
    # a budget its cgroup cannot honour. Sized here for a 16GB machine (docker-compose.yml:
    # mem_limit 16g, GOMEMLIMIT=14GiB). Invariant: resource_memory_mib < GOMEMLIMIT < mem_limit.
    #
    # Resolved limits vs. the autoscaled ones these replace (autoscale @16GiB in brackets):
    #   streams inbound per peer 5376 [2304]   system memory 10368MiB [16512MiB, over mem_limit]
    #   inbound conns             704 [1088]   fds              8192 [1024]
    # More per-peer stream headroom than today, with the memory ceiling held inside the cgroup.
    # The remaining ~4GiB under GOMEMLIMIT is for badger and the indexer.
    #
    # These knobs scale the per-peer, per-protocol and system scopes only. The per-stream (16MiB),
    # per-protocol-per-peer (16MiB) and per-connection (32MiB) memory ceilings are constant at
    # every budget and cannot be raised from here.
    resource_memory_mib: 10240
    resource_file_descriptors: 8192   # Must be <= the process ulimit -n
    max_streams_per_peer: 4096        # Per direction. Must exceed 256, the unscaled base, or it is a no-op.
  store:
    path: "./.defra"
    # Badger memory configuration
    block_cache_mb: 512  # Block cache size
    memtable_mb: 64      # Memtable size
    index_cache_mb: 256   # Index cache size
    # Badger compaction configuration
    num_compactors: 4              # Number of compaction workers
    # num_level_zero_tables: 10      # L0 tables before compaction starts
    # num_level_zero_tables_stall: 30  # L0 tables that trigger write stalls
    # Badger value log configuration
    value_log_file_size_mb: 128      # Size of each vlog file (smaller = more effective GC)
# The geth section name is historical. The Generator is chain-agnostic and accepts any compatible JSON-RPC and WebSocket endpoint, not just Geth.
geth:
  node_url: "${GETH_RPC_URL}"  # Fallback
  ws_url: "${GETH_WS_URL}"
  api_key: "${GETH_API_KEY}"
  api_key_type: "${GETH_API_KEY_TYPE}"
  dial_timeout_seconds: 10     # Positive: bounds the startup WebSocket dial (seconds); WS timeout with HTTP connected starts HTTP-only. 0 or negative = unbounded (env: GETH_DIAL_TIMEOUT_SECONDS)
indexer:
  start_height: 0           # 0 = auto-detect from chain tip; set a block number to start from a specific height
  concurrent_blocks: 2      # Number of blocks to process concurrently
  receipt_workers: 8        # Concurrent receipt fetchers per block
  max_docs_per_txn: 100    # Docs threshold for single-txn block creation
  max_tx_docs_per_batch: 100   # Per-batch size for transactions (0 = use max_docs_per_txn)
  max_log_docs_per_batch: 125  # Per-batch size for logs (0 = use max_docs_per_txn)
  max_ale_docs_per_batch: 500  # Per-batch size for ALEs (0 = use max_docs_per_txn)
  blocks_per_minute: 150     # Block indexing rate limit
  health_server_port: 8080  # Health server port (-1 == disabled)
  open_browser_on_start: false  # Auto-open health page on startup
  start_buffer: 100        # Start this many blocks before chain tip when skipping ahead
  schema_auth_mode: "token" # Auth mode for schema endpoint: none, token, mtls (env: SCHEMA_AUTH_MODE overrides)
  # ⚠ schema_api_keys is NOT configurable in this file (the field uses yaml:"-").
  # You MUST set keys via the SCHEMA_API_KEYS environment variable (comma-separated).
  # Example: SCHEMA_API_KEYS=key1,key2,key3
  # If you set schema_auth_mode to "token" (or leave it empty) without providing keys,
  # ALL schema requests will return 503 Service Unavailable.
  max_network_latency_ms: 200 # Max average wall time of the block-fetch RPC over the rolling window. Env: INDEXER_MAX_NETWORK_LATENCY_MS
  # 200ms is exactly the cap enforced by validation: 150 blocks_per_minute →
  # 60000/150 = 400ms/block → threshold must be ≤ 400/2 = 200ms. A generator whose
  # average fetch burns half a block interval can never hold the tip, so arm the
  # tripwire at that limit rather than above it.
  latency_window_blocks: 50 # Number of recent committed blocks the rolling latency window holds. (env: INDEXER_LATENCY_WINDOW_BLOCKS)
  # Must be ≤ half snapshot blocks_per_file so the frozen post-breach window fits one snapshot file 
logger:
  development: true
  level: "info"
pruner:
  enabled: true             # Set to true to enable automatic pruning
  max_blocks: 16000          # Number of blocks to retain (~2h at BSC's 0.45s block time)
  max_blocks_per_cycle: 100  # Max blocks one prune cycle may delete. BSC produces ~67 blocks per 30s interval, so the cap must exceed that or retention drifts upward indefinitely.
  prune_threshold: 1        # Trigger pruning when exceeding max_blocks by this amount
  interval_seconds: 30      # How often to check and prune
  prune_history: true       # Walk DAG chains to delete historical block versions (2-3x slower)
snapshot:
  enabled: true             # Set to true to enable automatic snapshots before pruning
  dir: "./.defra/snapshots" # Directory to store snapshot files
  blocks_per_file: 100      # Snapshot granularity (blocks per snapshot file)
  interval_seconds: 30      # How often to check and create snapshots
  max_snapshots: 200        # Keep the N newest snapshot files
  # Older files (and their signature docs) are purged. -1 = unlimited (env: SNAPSHOT_MAX_SNAPSHOTS).
  # Must satisfy: max_snapshots * blocks_per_file >= pruner.max_blocks
converter:
  lowest_block_query_limit: 1   # Row window for the lowest-block number query (env: CONVERTER_LOWEST_BLOCK_QUERY_LIMIT).
  # ⚠ >1 makes the query skip purge residue: block rows left behind by DefraDB purges
  # whose number field is missing or unparseable. Without it, a single residue row fails
  # every snapshot/prune tick with "block exists but has invalid or unparseable number field".
  # Keep at 1 unless you encounter that error; then set it above the count of consecutive
  # residue rows (20 covers observed incidents). The current DefraDB no longer produces
  # residue (primary-key purge fix), so >1 only matters for stores written before the bump.
