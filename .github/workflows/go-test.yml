# This workflow will run the mise test tasks (gotestsum, golden tests) on the project when creating a PR (or trying to push to) main
name: Go Test CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Cache Go modules and build cache
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-go-test-

    - name: Set up mise
      uses: jdx/mise-action@v5

    - name: Get CPU count
      id: cpu
      run: echo "count=$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" >> $GITHUB_OUTPUT

    - name: Verify build
      run: mise x -- go build ./...

    - name: Run tests
      env:
        GETH_RPC_URL: ${{ secrets.GETH_RPC_URL }}
        GETH_WS_URL: ${{ secrets.GETH_WS_URL }}
        GETH_API_KEY: ${{ secrets.GETH_API_KEY }}
        DEFRADB_URL: http://localhost:9181
        LOG_LEVEL: error
      run: mise run test-unit --parallel ${{ steps.cpu.outputs.count  }}

    - name: Run all golden tests
      run: mise run golden

    - name: Run all scrub tests for the replay harness
      run: mise run replay-scrub-guards

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: shinzonetwork/shinzo-generator-client
        files: coverage.out
        fail_ci_if_error: true
