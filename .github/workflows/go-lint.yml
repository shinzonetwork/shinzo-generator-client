# This workflow will run the 'lint' mise task (golangci-lint) on the project when creating a PR (or trying to push to) main
name: Go Lint CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up mise
      uses: jdx/mise-action@v5
  
    - name: Cache Go modules and build cache
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: ${{ runner.os }}-go-lint-${{ hashFiles('go.sum', '.golangci.yml', '.golangci.yaml') }}
        restore-keys: |
          ${{ runner.os }}-go-lint-${{ hashFiles('go.sum') }}-
          ${{ runner.os }}-go-lint-

    - name: Get CPU count
      id: cpu
      run: echo "count=$(nproc 2>/dev/null || sysctl -n hw.ncpu || echo 2)" >> $GITHUB_OUTPUT
    
    - name: Linting checks
      run: mise run lint
