[tool_alias]
deadcode = "go:golang.org/x/tools/cmd/deadcode"
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"
goimports = "go:golang.org/x/tools/cmd/goimports"

[tools]
go = "1.27.3"
goimports = "0.52.0"
golangci-lint = "2.15.0"
gotestsum = "1.13.0"
govulncheck = "1.9.0"
deadcode = "0.52.0"

[env]
_.file = ".env"

[vars]
# Executes the git command dynamically when mise loads the config
VERSION = "{{ exec(command='git describe --tags --always --dirty 2>/dev/null || echo dev') }}"

# Code quality tasks & templates
[tasks.format]
description = "Formatting code and imports."
run = [
    "gofmt -s -w .", 
    "goimports -w -local github.com/shinzonetwork/shinzo-generator-client ." 
]
    
[task_templates."go:lint"]
description = "Linting check for the codebase."
vars = { flag= "" }
run = "golangci-lint run {{ vars.flag }} ./..."

[tasks.lint]
extends = "go:lint"

[tasks.lint-fix]
description = "Linting check for the codebase with autorepair."
extends = "go:lint"
vars = { flag= "--fix" }

[tasks.vuln]
description = "Static analysis check for the codebase."
run = "govulncheck ./..."

[tasks.inspect]
description = "Running all code quality and dependencies vulnerability checks."
depends = ["format", "lint"]
run = [
   # Sequential tasks
   { tasks = ["scripts/check_loc.sh", "scripts/check_deadcode.sh"] },  # Parallel tasks
   { task = "vuln" }
]

# Testing tasks & templates
[tasks.test-unit]
description = "Running unit tests with coverage report."
run = "gotestsum -- -coverprofile=coverage.out -parallel=4 ./... -count=1"
alias = "test"

[task_templates."test:integration"]
run = "go test -tags=integration  -v ./integration/"

[tasks.evm-integration]
description = "Running the EVM integration tests."
extends = "test:integration"

[task_templates."test:golden"]
run = "go test -tags=integration -v ./golden/"

[tasks.ethereum-golden]
description = "Running the Ethereum golden tests."
extends = "test:golden"

[task_templates."test:replay"]
vars = { chain-family = "evm", replay-test = "TestEthereumReplayAcceptance" }
run = "go test -tags=acceptance ./replay/{{ vars.chain-family }} -run {{ vars.replay-test }}} -count=1 -v -timeout 30m"

[tasks.ethereum-replay]
description = "Running the Ethereum replay test."
extends = "test:replay"

[tasks.bsc-replay]
description = "Running the BSC replay test."
extends = "test:replay"
vars = { replay-test = "TestBSCReplayAcceptance" }

[tasks.replay-fetch]
description = "Fetch blocks for the replay test harness."
usage = '''
flag "--chain <chain>" help="Target chain" default="ethereum"
flag "--network <network>" help="Target network" default="mainnet"
flag "--from <from>" help="Start block" default="0"
flag "--to <to>" help="End block" default="0"
'''
run="go run ./cmd/fetch_blocks --chain ${usage_chain} --network ${usage_network} --from ${usage_from} --to ${usage_to}"

[task_templates."test:live"]
vars = { chain = "", timeout="20s" }  
run = "go test -tags=live -v ./integration/live/{{ vars.chain }} -count=1 -timeout={{ vars.timeout }}"

[tasks.ethereum-live-test]
description = "Running Ethereum live tests"
extends = "test:live"

[tasks.bsc-live-test]
description = "Running BSC live tests"
extends = "test:live"
vars = { chain = "bsc", timeout="400s" }  

[tasks.ethereum-test]
description = "Running all Ethereum-related test suites."
depends = ["test-unit", "evm-integration", "ethereum-golden"]

# Binary building tasks & templates
[task_templates."generator:build"]
description = "Building the generator binary."
vars = { ldflags = '"-X github.com/shinzonetwork/shinzo-generator-client/config.Version={{ vars.VERSION }}"'} 
run = "go build -ldflags {{ vars.ldflags }} -o bin/block_poster ./cmd/block_poster/"

[tasks.build]
extends = "generator:build"

[tasks.build-all]
description = "Building block_poster, fetch_blocks, and build_schema binaries."
depends = "build"
run = [
    "go build -o bin/fetch_blocks ./cmd/fetch_blocks/",
    "go build -o bin/build_schema ./cmd/build_schema/"
]

# Generator startup tasks & templates
[task_templates."generator:start"]
vars = { config = "./config/config.yaml"}
run = "./bin/block_poster --config {{ vars.config }}"

[tasks.ethereum-start]
description = "Starting Ethereum generator binary."
extends="generator:start"

[tasks.bsc-start]
description = "Starting BSC generator binary."
extends="generator:start"
vars = { config = "./config/config_bsc.yaml" }

# Cleanup and client stop tasks
[tasks.clean]
description = "Cleaning local project binaries and log files."
run = "rm -rf bin/ && rm -r logs/logfile.log && touch logs/logfile.log"

[tasks.stop]
description = "Stop running DefraDB and block_poster processes"
run = '''
#!/usr/bin/env bash
set -euo pipefail

DEFRA_ROOTDIR="$PWD/.defra"
DEFRA_PIDS=$(ps aux | grep '[d]efradb start --rootdir ' | grep "$DEFRA_ROOTDIR" | awk '{print $2}' || true)
if [ -n "$DEFRA_PIDS" ]; then
  echo "Killing defradb PIDs: $DEFRA_PIDS"
  echo "$DEFRA_PIDS" | xargs -r kill -9 2>/dev/null || true
  echo "Stopped all defradb processes using $DEFRA_ROOTDIR"
else
  echo "No defradb processes found for $DEFRA_ROOTDIR"
fi
rm -f .defra/defradb.pid

echo "===> Stopping block_poster if running..."
BLOCK_PIDS=$(ps aux | grep '[b]lock_poster' | awk '{print $2}' || true)
if [ -n "$BLOCK_PIDS" ]; then
  echo "Killing block_poster PIDs: $BLOCK_PIDS"
  echo "$BLOCK_PIDS" | xargs -r kill -9 2>/dev/null || true
  echo "Stopped all block_poster processes"
else
  echo "No block_poster processes found"
fi
rm -f .defra/block_poster.pid
'''

# Misc 
[tasks.node-status]
description = "Probe an Ethereum-compatible JSON-RPC endpoint via eth_blockNumber"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [ -z "${GETH_RPC_URL:-}" ]; then
  echo "❌ GETH_RPC_URL not set"
  exit 1
fi

BLOCK_RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
  -H "X-goog-api-key: ${GETH_API_KEY:-}" \
  --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
  "$GETH_RPC_URL" 2>/dev/null)

if echo "$BLOCK_RESPONSE" | jq -e '.result' >/dev/null 2>&1; then
  BLOCK_HEX=$(echo "$BLOCK_RESPONSE" | jq -r '.result')
  BLOCK_NUM=$(printf "%d" "$BLOCK_HEX" 2>/dev/null || echo "unknown")
  echo "✅ Block: $BLOCK_NUM"
else
  echo "❌ Failed: $BLOCK_RESPONSE"
  exit 1
fi
'''
