type Cosmos__Mainnet__CosmosEvent {
    blockNumber: Int @index
    phase: String
    transactionHash: String
    transactionIndex: Int
    eventIndex: Int
    type: String @index
    attributes: String
    # Relationships
    block: Cosmos__Mainnet__Block @relation(name: "block_cosmosEvents")
    transaction: Cosmos__Mainnet__CosmosTransaction @relation(name: "cosmosTransaction_events")
}
