# One compiled (outer) or inner (CPI) instruction. Instruction data is stored
# raw (base58-encoded); decoding is deferred to a later phase. stackHeight is
# set only on inner instructions: its key presence distinguishes inner from
# outer documents.
type Solana__Mainnet__Instruction {
    # Parent transaction's signature. DefraDB docIDs are content hashes, so two
    # byte-identical instructions (identical memo transfers are routine on
    # mainnet) would otherwise collide on one document; this field keeps every
    # instruction's content unique.
    transactionSignature: String
    programId: String
    accounts: [String]
    data: String
    stackHeight: Int
    blockHash: String
    blockNumber: Int @index
    # Relationships
    block: Solana__Mainnet__Block @relation(name: "solana_block_instructions")
    transaction: Solana__Mainnet__Transaction @relation(name: "solana_transaction_instructions")
    parentInstruction: Solana__Mainnet__Instruction @relation(name: "solana_instruction_inner")
}
