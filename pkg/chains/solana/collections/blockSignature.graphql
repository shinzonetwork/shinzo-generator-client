# BlockSignature covers all documents in a block (txs, instructions, token
# balance changes, rewards, and the block itself).
# Created in the same transaction as the block data, arrives via P2P together
type Solana__Mainnet__BlockSignature {
    blockNumber: Int @index
    blockHash: String
    merkleRoot: String
    cidCount: Int
    cids: [String]
    signatureType: String
    signatureIdentity: String
    signatureValue: String
    createdAt: String
}
