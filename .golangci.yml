version: "2"
run:
  timeout: 10m
  modules-download-mode: readonly
linters:
  default: standard
  enable:
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - goconst
    - gocritic
    - godoclint
    - godot
    - gosec
    - govet
    - importas
    - inamedparam
    - ineffassign
    - loggercheck
    - misspell
    - mnd
    - modernize
    - nilerr
    - nilnil
    - revive
    - staticcheck
    - tagalign
    - unconvert
    - unused
    - wastedassign
    # - err113 # TODO - enable this linter and fix the issues it finds. by creating errors file with all reusable errors in it.
  settings:
    depguard:
      rules:
        chain-boundary:
          files:
            - "$all"
            - "!$test"
            - "!**/pkg/chains/evm/**"
            - "!**/pkg/chains/solana/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/shinzonetwork/shinzo-generator-client/pkg/chains/evm
              desc: production code must consume the pkg/chains interfaces; the evm adapter is wired only by cmd/ binaries and imported only by tests
            - pkg: github.com/shinzonetwork/shinzo-generator-client/pkg/chains/solana
              desc: production code must consume the pkg/chains interfaces; the solana adapter is wired only by cmd/ binaries and imported only by tests
    funlen:
      lines: 100
    revive:
      enable-default-rules: true
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - containedctx
          - dupl
          - gochecknoglobals
          - gosec
          - goconst
          - mnd
          - funlen
formatters:
  enable:
    - gofumpt
